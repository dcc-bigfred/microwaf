[package]
name = "microwaf"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "MicroWAF daemon and CLI"
build = "build.rs"

[[bin]]
name = "microwaf"
path = "src/main.rs"

[lints.rust]
unsafe_code = "allow"
unused_must_use = "deny"

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"

[dependencies]
mw-proto = { path = "../mw-proto" }
mw-core = { path = "../mw-core" }
mw-sniffer = { path = "../mw-sniffer" }
mw-store = { path = "../mw-store" }
mw-client = { path = "../mw-client" }
dcc-daemon = { git = "https://github.com/dcc-bigfred/rust-commons.git", branch = "main" }
clap = { version = "4", features = ["derive", "env"] }
humantime = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
parking_lot = "0.12"
arc-swap = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
thiserror = "2"
anyhow = "1"
libc = "0.2"
nix = { version = "0.29", features = ["signal", "user", "fs", "poll", "term"] }
aya = { version = "0.13", optional = true }
ctrlc = "3"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

[dev-dependencies]
tempfile = "3"

[features]
default = ["ebpf"]
ebpf = ["dep:aya"]
# Userspace-only build (no aya / XDP loader): `--no-default-features`