[workspace]
resolver = "2"
members = [
    "crates/mw-proto",
    "crates/mw-core",
    "crates/mw-sniffer",
    "crates/mw-store",
    "crates/mw-client",
    "crates/microwaf",
]
# mw-ebpf is built separately for bpfel-unknown-none (see Makefile `ebpf` target).
exclude = ["crates/mw-ebpf"]
default-members = [
    "crates/mw-proto",
    "crates/mw-core",
    "crates/mw-sniffer",
    "crates/mw-store",
    "crates/mw-client",
    "crates/microwaf",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["BigFred"]
repository = "https://github.com/dcc-bigfred/microwaf"

[workspace.lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
overflow-checks = true

[profile.release-assertions]
inherits = "release"
debug-assertions = true
overflow-checks = true
strip = false
